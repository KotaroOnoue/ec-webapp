<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品一覧</title>
    <link rel="stylesheet" th:href="@{/css/products.css}">
</head>
<body>
    <div class="page-shell">
        <header class="site-header">
            <h1 class="site-title">ECサイト</h1>
            <a class="cart-link" th:href="@{/cart}" aria-label="カートを見る">
                <span>カートを見る</span>
                <span class="cart-count" th:text="${cartItemCount}">0</span>
            </a>
        </header>

        <main>
            <section class="hero" aria-labelledby="product-list-title">
                <span class="hero-tag">PRODUCT LIST</span>
                <h2 class="page-title" id="product-list-title">商品一覧</h2>
                <p class="hero-copy">
                    販売中の商品をデータベースから取得して表示しています。商品をカートへ追加すると、現在のカート登録数量を加味して在庫数を超えないか検証します。
                </p>
            </section>

            <section class="message-banner" id="error-message" th:if="${errorMessage != null}" tabindex="-1">
                <p th:text="${errorMessage}">エラーメッセージ</p>
            </section>

            <section class="message-banner message-banner-validation" th:if="${#fields.hasErrors('cartAddForm.*')}">
                <p th:each="message : ${#fields.errors('cartAddForm.*')}" th:text="${message}">入力エラー</p>
            </section>

            <section class="product-grid" aria-label="商品一覧">
                <article class="product-card" th:each="product : ${products}">
                    <div class="product-image-wrap">
                        <img class="product-image"
                             th:src="@{${product.imageUrl}}"
                             th:alt="${product.name} + 'の商品画像'">
                    </div>

                    <div class="product-content">
                        <h3 class="product-name" th:text="${product.name}">商品名</h3>
                        <p class="product-price" th:text="'¥' + ${#numbers.formatInteger(product.price, 0, 'COMMA')}">¥0</p>
                        <p class="product-description" th:text="${product.description}">商品説明</p>

                        <div class="stock-row">
                            <span class="stock-badge" th:classappend="${product.stock == 0} ? ' is-out' : ''">
                                <span class="stock-dot"></span>
                                <span th:text="${product.stock == 0} ? '在庫なし' : '在庫あり'">在庫あり</span>
                            </span>
                            <span class="stock-count" th:text="'在庫数: ' + ${product.stock}">在庫数: 0</span>
                        </div>

                        <div class="button-group">
                            <a class="action-button secondary" th:href="@{/products/{productId}(productId=${product.productId})}">詳細を見る</a>

                            <form class="cart-form" th:action="@{/cart/items}" method="post">
                                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <input type="hidden" name="productId" th:value="${product.productId}">
                                <input type="hidden" name="quantity" value="1">
                                <input type="hidden" name="redirectTo" value="/products">
                                <button class="action-button primary" type="submit" th:disabled="${product.stock == 0}">カートに追加</button>
                            </form>
                            <a class="action-button ghost" th:href="@{/cart}">カートを見る</a>
                        </div>

                        <p class="card-footnote">
                            <span th:if="${cart[product.productId] != null}" th:text="'カート内数量: ' + ${cart[product.productId]}">カート内数量: 0</span>
                            <span th:if="${cart[product.productId] == null}">まだカートには追加されていません。</span>
                        </p>
                    </div>
                </article>
            </section>
        </main>
    </div>

    <script th:src="@{/js/products.js}"></script>
</body>
</html>
