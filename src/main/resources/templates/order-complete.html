<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注文完了</title>
    <link rel="stylesheet" th:href="@{/css/products.css}">
    <link rel="stylesheet" th:href="@{/css/order-complete.css}">
</head>
<body>
    <div class="page-shell">
        <header class="site-header">
            <h1 class="site-title">ECサイト</h1>
            <nav class="header-links" aria-label="ヘッダーナビゲーション">
                <a class="nav-link" th:href="@{/products}">商品一覧</a>
                <a class="nav-link" th:href="@{/cart}">カート</a>
                <span class="nav-link-current" aria-disabled="true">注文完了</span>
            </nav>
        </header>

        <main>
            <section class="hero" aria-labelledby="order-complete-title">
                <span class="hero-tag">ORDER COMPLETED</span>
                <h2 class="page-title" id="order-complete-title">注文完了</h2>
                <p class="hero-copy">
                    ご注文ありがとうございました。注文内容を受け付けました。以下の注文番号を控えておく想定です。
                </p>
            </section>

            <section class="complete-card" aria-label="注文完了情報">
                <div class="status-badge">ORDER COMPLETED</div>

                <div class="order-number-panel">
                    <span class="order-number-label">Order Number</span>
                    <p class="order-number" th:text="${order.orderId}">1</p>
                </div>

                <div class="message-box">
                    <p>発送準備が整い次第、ご登録いただいた配送先へ商品をお届けします。</p>
                    <p>続けてお買い物をする場合は、商品一覧画面へ戻ってください。</p>
                </div>

                <a class="action-button primary" th:href="@{/products}">商品一覧に戻る</a>
            </section>
        </main>
    </div>
</body>
</html>
