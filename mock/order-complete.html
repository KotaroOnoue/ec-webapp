<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注文完了</title>
  <style>
    :root {
      --bg: #f4ede4;
      --surface: rgba(255, 250, 244, 0.88);
      --surface-strong: #ffffff;
      --line: rgba(122, 82, 43, 0.16);
      --text: #26170a;
      --muted: #6f5a48;
      --brand: #b85c38;
      --brand-strong: #8f3f20;
      --success: #276749;
      --success-soft: rgba(39, 103, 73, 0.08);
      --shadow: 0 22px 50px rgba(83, 49, 20, 0.12);
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Yu Gothic", "Hiragino Sans", "Meiryo", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(255, 214, 170, 0.75), transparent 34%),
        radial-gradient(circle at top right, rgba(184, 92, 56, 0.14), transparent 26%),
        linear-gradient(160deg, var(--bg) 0%, #f9f6f0 54%, #efe3d5 100%);
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: -1;
      border-radius: 999px;
      filter: blur(10px);
      opacity: 0.72;
    }

    body::before {
      width: 18rem;
      height: 18rem;
      top: 6rem;
      left: -6rem;
      background: rgba(255, 224, 196, 0.95);
    }

    body::after {
      width: 20rem;
      height: 20rem;
      right: -7rem;
      bottom: 8rem;
      background: rgba(214, 145, 96, 0.18);
    }

    .page-shell {
      width: min(980px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0 72px;
    }

    .complete-card {
      display: grid;
      gap: 24px;
      padding: 40px;
      border: 1px solid rgba(122, 82, 43, 0.12);
      border-radius: calc(var(--radius-xl) + 6px);
      background: linear-gradient(140deg, rgba(255, 250, 244, 0.9), rgba(255, 255, 255, 0.72));
      box-shadow: var(--shadow);
      text-align: center;
    }

    .status-badge {
      display: inline-flex;
      justify-self: center;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 999px;
      background: var(--success-soft);
      color: var(--success);
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .page-title {
      margin: 0;
      font-size: clamp(2.1rem, 5vw, 3.8rem);
      line-height: 1.05;
      letter-spacing: 0.04em;
    }

    .lead {
      margin: 0 auto;
      max-width: 36rem;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.9;
    }

    .order-number-panel {
      display: grid;
      gap: 10px;
      padding: 24px;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(39, 103, 73, 0.18);
      background: rgba(255, 255, 255, 0.68);
    }

    .order-number-label {
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .order-number {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 900;
      color: var(--brand-strong);
      letter-spacing: 0.08em;
    }

    .message-box {
      display: grid;
      gap: 12px;
      padding: 24px;
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.58);
      border: 1px solid rgba(122, 82, 43, 0.1);
      text-align: left;
    }

    .message-box p {
      margin: 0;
      color: var(--muted);
      line-height: 1.8;
    }

    .action-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 24px;
      border: 0;
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(135deg, var(--brand), var(--brand-strong));
      box-shadow: 0 14px 28px rgba(143, 63, 32, 0.26);
      font: inherit;
      font-weight: 800;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      justify-self: center;
    }

    .action-button:hover,
    .action-button:focus-visible {
      transform: translateY(-1px);
      box-shadow: 0 18px 32px rgba(143, 63, 32, 0.3);
    }

    @media (max-width: 640px) {
      .page-shell {
        width: min(100% - 20px, 980px);
        padding-top: 20px;
      }

      .complete-card {
        padding: 24px 18px;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <main>
      <section class="complete-card" aria-labelledby="order-complete-title">
        <span class="status-badge">ORDER COMPLETED</span>
        <h1 class="page-title" id="order-complete-title">注文完了</h1>
        <p class="lead">
          ご注文ありがとうございました。ご注文内容を受け付けました。下記の注文番号は、お問い合わせや配送状況の確認時に必要になる想定です。
        </p>

        <div class="order-number-panel" aria-label="注文番号">
          <span class="order-number-label">Order Number</span>
          <p class="order-number">000123</p>
        </div>

        <div class="message-box">
          <p>ご登録いただいた配送先情報をもとに発送準備を進めます。</p>
          <p>注文完了後はカートが空になり、商品一覧画面へ戻って引き続きお買い物いただける想定です。</p>
        </div>

        <a class="action-button" href="./product-list.html">商品一覧に戻る</a>
      </section>
    </main>
  </div>
</body>
</html>
